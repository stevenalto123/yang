<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LifeCheckpoint — Emergency Monitoring & Disaster Preparedness PWA (Emilio Aguinaldo College)">
  <meta name="theme-color" content="#162A45">

  <!-- iOS & Mobile PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LifeCheckpoint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>LifeCheckpoint — Disaster Preparedness</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0F1E34;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    #lc-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1D3B63 0%, #0F1E34 65%, #091322 100%);
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #lc-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .lc-badge {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
    }
    .lc-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }
    .lc-sub {
      font-size: 13.5px;
      color: #CBD5E1;
      margin: 0 0 24px;
    }
    .lc-bar {
      width: 180px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }
    .lc-bar-fill {
      width: 45%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #38BDF8, #34D399);
      animation: lc-slide 1.15s ease-in-out infinite;
    }
    @keyframes lc-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="lc-splash" aria-label="Loading LifeCheckpoint">
    <div class="lc-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4" stroke="#34D399"/>
      </svg>
    </div>
    <div class="lc-title">LifeCheckpoint</div>
    <div class="lc-sub">Emilio Aguinaldo College • Disaster Preparedness</div>
    <div class="lc-bar"><div class="lc-bar-fill"></div></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('lc-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
