<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="LifeCheckpoint — City of Manila Emergency Monitoring & Disaster Preparedness PWA">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iOS & Mobile PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LifeCheckpoint">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>LifeCheckpoint — Disaster Preparedness</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      background: #FFFFFF;
      overscroll-behavior-y: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }
    #lc-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1D3B63 0%, #0F1E34 65%, #091322 100%);
      color: #F8FAFC;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #lc-splash.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .lc-badge {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.3);
    }
    .lc-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }
    .lc-sub {
      font-size: 13.5px;
      color: #CBD5E1;
      margin: 0 0 24px;
    }
    .lc-bar {
      width: 180px;
      height: 4px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.14);
      overflow: hidden;
    }
    .lc-bar-fill {
      width: 45%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, #38BDF8, #34D399);
      animation: lc-slide 1.15s ease-in-out infinite;
    }
    @keyframes lc-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
  </style>
</head>
<body>
  <div id="lc-splash" aria-label="Loading LifeCheckpoint">
    <div class="lc-badge">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="M9 12l2 2 4-4" stroke="#34D399"/>
      </svg>
    </div>
    <div class="lc-title">LifeCheckpoint</div>
    <div class="lc-sub">City of Manila • Family Disaster Preparedness</div>
    <div class="lc-bar"><div class="lc-bar-fill"></div></div>
  </div>

  <script>
    // PWA install prompt & offline survival whistle bridge
    window.__lcDeferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      window.__lcDeferredPrompt = e;
    });
    window.__lcCanInstall = function () {
      return !!window.__lcDeferredPrompt;
    };
    window.__lcIsInstalled = function () {
      return (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );
    };
    window.__lcIsIos = function () {
      return /iphone|ipad|ipod/i.test(window.navigator.userAgent || '');
    };
    window.__lcTriggerInstall = async function () {
      var p = window.__lcDeferredPrompt;
      if (!p) return false;
      p.prompt();
      var choice = await p.userChoice;
      window.__lcDeferredPrompt = null;
      return !!(choice && choice.outcome === 'accepted');
    };

    // Offline 3.1kHz emergency rescue whistle via Web Audio API
    window.__lcWhistleCtx = null;
    window.__lcWhistleTimer = null;
    window.__lcStartWhistle = function () {
      try {
        window.__lcStopWhistle();
        var AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return false;
        var ctx = new AudioCtx();
        var osc1 = ctx.createOscillator();
        var osc2 = ctx.createOscillator();
        var gain = ctx.createGain();
        osc1.type = 'sine';
        osc2.type = 'triangle';
        osc1.frequency.value = 3050;
        osc2.frequency.value = 3280;
        gain.gain.value = 0.0001;
        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(ctx.destination);
        osc1.start();
        osc2.start();
        window.__lcWhistleCtx = ctx;
        var pulseOn = true;
        function pulse() {
          if (!window.__lcWhistleCtx) return;
          gain.gain.setTargetAtTime(pulseOn ? 0.55 : 0.0001, ctx.currentTime, 0.02);
          pulseOn = !pulseOn;
        }
        pulse();
        window.__lcWhistleTimer = setInterval(pulse, 550);
        return true;
      } catch (e) {
        return false;
      }
    };
    window.__lcStopWhistle = function () {
      try {
        if (window.__lcWhistleTimer) {
          clearInterval(window.__lcWhistleTimer);
          window.__lcWhistleTimer = null;
        }
        if (window.__lcWhistleCtx) {
          window.__lcWhistleCtx.close();
          window.__lcWhistleCtx = null;
        }
      } catch (e) {}
    };

    window.__lcSetThemeColor = function (isDark) {
      try {
        var bg = isDark ? '#111827' : '#FFFFFF';
        document.documentElement.style.background = bg;
        document.body.style.background = bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      } catch (e) {}
    };

    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('lc-splash');
      if (splash) {
        splash.classList.add('hidden');
        setTimeout(function () { splash.remove(); }, 400);
      }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            var url = (r.active && r.active.scriptURL) || (r.installing && r.installing.scriptURL) || '';
            if (url.indexOf('flutter_service_worker.js') !== -1) {
              r.unregister();
            }
          });
        }).catch(function () {});
        navigator.serviceWorker.register('./sw.js', { scope: './' });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
